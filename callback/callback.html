<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticando...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #121212;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: "New Rocker", sans-serif;
            color: #fff;
            flex-direction: column;
            gap: 16px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #282828;
            border-top-color: #cc0000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #b3b3b3; font-size: 14px; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Autenticando com Spotify...</p>
    <script>
        async function processarCallback() {
            const params = new URLSearchParams(window.location.search);
            const code   = params.get("code");
            const error  = params.get("error");

            if (error || !code) {
                document.querySelector("p").textContent = "Erro na autenticação. Redirecionando...";
                setTimeout(() => window.location.href = "../index.html", 2000);
                return;
            }

            const codeVerifier = localStorage.getItem("se_code_verifier");
            const clientId     = "26a4960d1ff049cd856ef4656003a29b";
            const redirectUri  = window.location.origin + "/sound-energy/callback/callback.html";

            try {
                const response = await fetch("https://accounts.spotify.com/api/token", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams({
                        grant_type:    "authorization_code",
                        code:          code,
                        redirect_uri:  redirectUri,
                        client_id:     clientId,
                        code_verifier: codeVerifier
                    })
                });

                const data = await response.json();
                console.log("Token response:", data);

                if (data.access_token) {
                    localStorage.setItem("se_oauth_token",      data.access_token);
                    localStorage.setItem("se_oauth_refresh",    data.refresh_token || "");
                    localStorage.setItem("se_oauth_expires_at", Date.now() + (data.expires_in - 60) * 1000);
                    localStorage.removeItem("se_code_verifier");

                    // Busca dados do usuário
                    const userResp = await fetch("https://api.spotify.com/v1/me", {
                        headers: { "Authorization": "Bearer " + data.access_token }
                    });
                    const user = await userResp.json();
                    localStorage.setItem("se_spotify_user", JSON.stringify({
                        nome:  user.display_name || "Usuário",
                        foto:  user.images?.[0]?.url || "",
                        id:    user.id,
                        email: user.email || ""
                    }));
                } else {
                    console.error("Erro no token:", data);
                }
            } catch (e) {
                console.error("Erro ao trocar código:", e);
            }

            window.location.href = "../index.html";
        }

        processarCallback();
    </script>
</body>
</html>
