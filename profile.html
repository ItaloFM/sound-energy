<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil — Sound Energy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Roboto+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" type="image/png" href="imgs/2243c3de-9ed4-4bf6-8874-9e36f36f4d09.png">
    <link rel="stylesheet" href="profile.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar fixed-top">
        <div class="container-fluid navbar-inner">
            <div class="navbar-logo">
                <a href="index.html">
                    <img src="imgs/2243c3de-9ed4-4bf6-8874-9e36f36f4d09.png" alt="Logo" width="38px">
                </a>
                <a class="navbar-brand Logo" href="index.html">Sound Energy</a>
            </div>
            <div class="navbar-user" id="navbar-user">
                <div class="navbar-avatar" id="navbar-avatar">?</div>
                <span class="navbar-username" id="navbar-username">Perfil</span>
            </div>
        </div>
    </nav>

    <main class="profile-main">

        <!-- Banner do perfil -->
        <section class="profile-banner" id="profile-banner">
            <div class="profile-banner-bg" id="profile-banner-bg"></div>
            <div class="profile-banner-inner">
                <div class="profile-avatar-wrap">
                    <img src="" alt="Foto de perfil" class="profile-avatar" id="profile-avatar">
                    <div class="profile-avatar-placeholder" id="profile-avatar-placeholder">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="#535353">
                            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                        </svg>
                    </div>
                </div>
                <div class="profile-info">
                    <span class="profile-label">Perfil</span>
                    <h1 class="profile-name" id="profile-name">Carregando...</h1>
                    <div class="profile-meta" id="profile-meta">
                        <span class="profile-followers" id="profile-followers"></span>
                        <span class="profile-plan" id="profile-plan"></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Seção de playlists -->
        <section class="profile-section">
            <h2 class="profile-section-title">Suas Playlists</h2>
            <div class="profile-playlists" id="profile-playlists">
                <!-- Skeletons -->
                <div class="playlist-card-skeleton"><div class="skeleton-cover"></div><div class="skeleton-bar skeleton-bar-md" style="margin-top:10px"></div></div>
                <div class="playlist-card-skeleton"><div class="skeleton-cover"></div><div class="skeleton-bar skeleton-bar-md" style="margin-top:10px"></div></div>
                <div class="playlist-card-skeleton"><div class="skeleton-cover"></div><div class="skeleton-bar skeleton-bar-md" style="margin-top:10px"></div></div>
                <div class="playlist-card-skeleton"><div class="skeleton-cover"></div><div class="skeleton-bar skeleton-bar-md" style="margin-top:10px"></div></div>
            </div>
        </section>

        <!-- Seção de artistas seguidos -->
        <section class="profile-section" id="artistas-section" style="display:none">
            <h2 class="profile-section-title">Artistas que você segue</h2>
            <div class="profile-artists" id="profile-artists"></div>
        </section>

    </main>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="profile.js"></script>
</body>
</html>
